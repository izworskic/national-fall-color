name: Inspect Blue Ridge production camera error
on:
  push:
    branches: ["camera-probe-final"]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live camera payload
        shell: bash
        run: |
          set -euo pipefail
          URL='https://national-fall-color.vercel.app/api/blue-ridge-visual-verification?lat=35.71&lon=-82.37&milepost=364.6&debug=1'
          code=$(curl --max-time 25 -L -sS -o /tmp/visual.json -w '%{http_code}' "$URL")
          echo "HTTP=$code"
          jq '{retrieved_at, automated_camera, nearby_count:(.nearby_cameras|length)}' /tmp/visual.json
          test "$code" = "200"
