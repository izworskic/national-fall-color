name: Probe camera fast
on:
  push:
    branches: ["camera-probe-final"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect direct PhenoCam summary
        shell: bash
        run: |
          set +e
          URL='https://phenocam.nau.edu/data/archive/asuhighlands/ROI/asuhighlands_DB_1000_3day.csv'
          echo '=== direct summary ==='
          curl --max-time 15 -L -sS -w '\nHTTP=%{http_code} time=%{time_total}\n' "$URL" -o /tmp/summary.csv
          echo "curl=$? bytes=$(wc -c </tmp/summary.csv 2>/dev/null || echo 0)"
          head -n 8 /tmp/summary.csv
          tail -n 5 /tmp/summary.csv
          exit 0
