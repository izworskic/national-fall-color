name: Verify Blue Ridge production camera fix
on:
  push:
    branches: ["camera-probe-final"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live camera payload
        shell: bash
        run: |
          set -euo pipefail
          URL='https://national-fall-color.vercel.app/api/blue-ridge-visual-verification?lat=35.71&lon=-82.37&milepost=364.6'
          code=$(curl --max-time 20 -L -sS -o /tmp/visual.json -w '%{http_code}' "$URL")
          echo "HTTP=$code"
          test "$code" = "200"
          jq '{retrieved_at, automated_camera:{available:.automated_camera.available, source_strategy:.automated_camera.source_strategy, signal:.automated_camera.signal}, nearby_count:(.nearby_cameras|length)}' /tmp/visual.json
          jq -e '.automated_camera.available == true' /tmp/visual.json >/dev/null
          jq -e '.automated_camera.signal.available == true' /tmp/visual.json >/dev/null
          jq -e '.automated_camera.source_strategy == "direct-known-roi-summary"' /tmp/visual.json >/dev/null
          jq -e '.automated_camera.signal.latest_date >= "2026-09-11"' /tmp/visual.json >/dev/null
          jq -e '(.nearby_cameras | length) >= 1' /tmp/visual.json >/dev/null
          echo 'CAMERA_FIX_LIVE_OK=1'
