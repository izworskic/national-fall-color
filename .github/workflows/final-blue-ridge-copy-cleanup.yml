name: Finish Blue Ridge visitor copy cleanup
on:
  push:
    branches: ["blue-ridge-persona-copy-cleanup"]
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[final-copy]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rewrite remaining visitor-facing science jargon
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/national-tools/fall-color/blue-ridge-parkway/index.html')
          s=p.read_text()
          replacements={
            'Loading USA-NPN observations…':'Checking recent leaf reports…',
            'Loading NWS context…':'Checking the next 7 days of weather…',
            'Loading U.S. Drought Monitor context…':'Checking how dry conditions have been…',
            '<strong>Elevation movement:</strong>':'<strong>Where color may move next:</strong>',
            'const place=best?.name||"the best sampled anchor";':'const place=best?.name||"the best Parkway stop";',
            'but a possible NPS closure overlaps this anchor. Treat road access as the deciding factor before a foliage trip.':'but a possible NPS closure overlaps this stop. Check road access before making the drive.',
            'This is the strongest sampled match, not proof of peak color.':'This is the best available timing match, but check a live camera before making a long drive.',
            ' is the best sampled anchor today, but it is still ':' is the best bet today, but it is still ',
            ' days before its historical mid-transition. If you are already on the Parkway, this is the best direction to try; otherwise wait.':' days before color usually gets strongest at this elevation. If you are already on the Parkway, this is the best direction to try; otherwise wait.',
            ' is the strongest sampled bet, about ':' is the best bet, about ',
            ' days before its historical mid-transition. A dedicated color trip is becoming reasonable, but this is not a peak-color claim.':' days before the stronger color window usually arrives. A dedicated color trip is getting closer.',
            'Strong historical color window':'Good time to chase color',
            ' is inside its strongest historical transition window. Current observations and weather still determine how vivid the drive looks on the ground.':' lines up with its usual strong color window. Check the cameras to see how it actually looks before you leave.',
            'Late side of the typical transition':'Still worth a look — do not wait too long',
            ' is still the strongest sampled option, but it is ':' is still the best bet, but it is ',
            ' days past its historical midpoint. Wind and leaf drop matter more now, so do not delay solely for a better modeled date.':' days past its usual strongest color window. Wind and leaf drop matter more now, so do not wait too long.',
            'Do not confuse “best available” with peak':'Higher-elevation color is likely fading',
            ' is the strongest remaining sampled option, but this anchor is ':' is the best remaining bet, but this stop is ',
            ' days past its historical midpoint. Favor lower elevations or treat the drive as a scenic trip rather than a foliage chase.':' days past its usual strongest color window. Lower elevations may have better remaining color.',
            'Historical window ':'Usual color window ',
            'AUTOMATED CAMERA DATA UNAVAILABLE':'CAMERA DATA UNAVAILABLE',
            'Recent Sentinel-2 scene found':'Recent satellite coverage found'
          }
          for a,b in replacements.items():
              s=s.replace(a,b)
          p.write_text(s)
          PY
      - name: Verify
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npm run vercel-build
      - name: Commit final visitor copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/national-tools/fall-color/blue-ridge-parkway/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Finish Blue Ridge visitor copy [final-copy]"
          git push
