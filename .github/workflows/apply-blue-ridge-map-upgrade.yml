name: Apply Blue Ridge map upgrade
on:
  push:
    branches: ["blue-ridge-real-map-persona-language"]
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[map-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply map and language migration
        run: node scripts/migrate-blue-ridge-user-map.mjs
      - name: Verify page and production build
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npm run vercel-build
      - name: Commit materialized page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/national-tools/fall-color/blue-ridge-parkway/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Materialize Blue Ridge real map and visitor language [map-applied]"
          git push
