name: Verify Blue Ridge live persona experience
on:
  push:
    branches: ["diagnose-vercel-persona-deploy"]
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    steps:
      - name: Probe canonical and upstream
        shell: bash
        run: |
          set -euo pipefail
          canonical='https://chrisizworski.com/national-tools/fall-color/blue-ridge-parkway/'
          upstream='https://national-fall-color.vercel.app/national-tools/fall-color/blue-ridge-parkway/'
          for url in "$canonical" "$upstream"; do
            echo "=== $url ==="
            code=$(curl -L -sS -o /tmp/page.html -w '%{http_code}' "$url")
            echo "HTTP $code"
            test "$code" = "200"
            grep -F 'Where will you be driving?' /tmp/page.html
            grep -F 'Anywhere / I’m flexible' /tmp/page.html
            grep -F '7 days from now' /tmp/page.html
            grep -F 'See what the leaves look like before you drive' /tmp/page.html
            grep -F 'Check NPS road status' /tmp/page.html
            grep -F 'blue-ridge-map' /tmp/page.html
            grep -F 'Best drive' /tmp/page.html
          done
